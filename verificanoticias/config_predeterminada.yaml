# Detección de dominios que imitan a medios reales.
imitacion:
  largo_minimo_marca: 5          # nombres más cortos (bbc, efe) solo se comparan de forma exacta
  distancia_maxima_corta: 1      # letras distintas permitidas para nombres de 5 a 8 letras
  distancia_maxima_larga: 2      # para nombres de 9 letras o más
  # Palabras demasiado comunes como para considerarlas "marca".
  palabras_comunes: ["noticias", "news", "diario", "mundo", "tiempo", "nacion", "pais", "semana", "prensa", "today", "times", "daily", "post", "nature", "journal", "radio", "online", "digital", "info", "press", "media", "global", "world", "cronica", "republica", "universal", "observador", "economista", "periodico", "comercio", "informador", "telegraph", "herald", "tribune", "independent", "guardian", "express", "mirror", "nacional", "popular"]
