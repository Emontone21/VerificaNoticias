  enganoso: ["enganoso", "enganosa", "misleading", "mostly false", "mayormente falso", "mayoritariamente falso", "parcialmente falso", "partly false", "partially false", "half true", "verdad a medias", "media verdad", "medio verdadero", "exagerado", "exagerada", "exaggerated", "exaggeration", "impreciso", "imprecisa", "inexacto", "inexacta", "inaccurate", "sacado de contexto", "fuera de contexto", "out of context", "missing context", "needs context", "lacks context", "falta contexto", "falta de contexto", "sin contexto", "manipulado", "manipulada", "manipulated", "altered", "alterado", "alterada", "false context", "contexto falso", "doctored", "distorted", "distorsionado", "distorts the facts", "cuestionable", "discutible", "mixture", "mixed", "mix", "mixto", "three pinocchios", "two pinocchios", "tres pinochos", "dos pinochos", "miscaptioned", "outdated", "desactualizado", "old video", "video viejo", "foto antigua", "imagen antigua", "trucado", "trucada", "not the whole story", "partly true", "parcialmente verdadero", "parcialmente cierto"]
  sin_evidencia: ["sin evidencia", "sin evidencias", "no hay evidencia", "no hay evidencias", "sin pruebas", "no hay pruebas", "no hay datos", "no evidence", "unproven", "unsupported", "unverified", "no verificado", "no verificable", "inverificable", "inchequeable", "insostenible", "apresurado", "no basis", "sin fundamento", "infundado", "unfounded", "research in progress", "sem provas", "legend"]
  mayormente_verdadero: ["mostly true", "mayormente verdadero", "mayoritariamente verdadero", "verdadero pero", "cierto pero", "true but", "verdadeiro mas", "casi verdadero", "one pinocchio", "un pinocho", "mostly accurate"]
  verdadero: ["verdadero", "verdadera", "true", "cierto", "cierta", "correct", "correcto", "correcta", "accurate", "verdade", "verdadeiro", "vrai", "wahr", "vero", "waar", "verdad", "confirmed", "confirmado", "confirmada", "correct attribution", "real", "es real"]
