alertas:
  mayusculas_proporcion_titular: 0.30   # proporción de palabras en MAYÚSCULAS en el titular
  mayusculas_proporcion_cuerpo: 0.08
  exclamaciones_titular: 2              # cantidad de "!" o "¡" en el titular
  exclamaciones_cada_1000_caracteres: 3
  minimo_caracteres_cuerpo: 300         # con menos texto no se evalúan algunas señales
