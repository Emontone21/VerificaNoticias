[project]
name = "verificanoticias"
version = "1.0.0"
description = "Aplicación local de verificación de noticias basada en fuentes públicas y heurísticas transparentes (sin IA)."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "trafilatura>=2.0",
    "lxml>=5.0",
    "yake>=0.4.8",
    "spacy>=3.8,<3.9",
    "es_core_news_sm @ https://github.com/explosion/spacy-models/releases/download/es_core_news_sm-3.8.0/es_core_news_sm-3.8.0-py3-none-any.whl",
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "scikit-learn>=1.4",
    "numpy>=1.24",
    "sumy>=0.11",
    "ddgs>=9.0",
    "feedparser>=6.0",
    "tldextract>=5.1",
    "rapidfuzz>=3.0",
    "python-whois>=0.9",
    "ijson>=3.2",
    "pyyaml>=6.0",
    "python-dateutil>=2.8",
    "truststore>=0.9",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["verificanoticias*"]

[tool.setuptools.package-data]
verificanoticias = ["web/static/*", "config_predeterminada.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
